name: WithDays
options:
  bundleIdPrefix: com.ffuime
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.29.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
  # Release is built for size: optimised for size, symbols stripped from the binaries (CI builds with
  # `build`, not `archive`, so stripping has to be switched on here), no dSYM, asset catalogs packed small.
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      GCC_OPTIMIZATION_LEVEL: s
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

packages:
  SlidesFeature:
    path: SlidesFeature
  # tooc's server. 12.x: 13 needs Xcode 26.2 or later.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

targets:
  WithDays:
    type: application
    platform: iOS
    sources:
      - path: WithDays
        excludes:
          - GoogleService-Info.plist
      # Written by the build from the GOOGLE_SERVICE_INFO_PLIST secret; without it tooc has no server.
      - path: WithDays/GoogleService-Info.plist
        buildPhase: resources
        optional: true
    info:
      path: WithDays/Info.plist
      properties:
        CFBundleDisplayName: WithDays
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Portrait everywhere; Slides' player turns to landscape (the app delegate decides, per moment).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Appleのカレンダーの予定を表示・追加・編集するために使います。
        NSCalendarsUsageDescription: Appleのカレンダーの予定を表示・追加・編集するために使います。
        NSCalendarsWriteOnlyAccessUsageDescription: Appleのカレンダーに予定を追加するために使います。
        NSRemindersFullAccessUsageDescription: ToDoとしてAppleのリマインダーを表示・追加・編集するために使います。
        NSRemindersUsageDescription: ToDoとしてAppleのリマインダーを表示・追加・編集するために使います。
        NSLocationWhenInUseUsageDescription: Goで最寄り駅から電車の時刻を調べ、toocで位置情報を送るために使います。
        NSCameraUsageDescription: Notesで書類をスキャンし、toocで友だちのQRコードを読み取って写真を撮って送り、Galleryで写真を撮るために使います。
        NSFaceIDUsageDescription: Galleryのロックしたアルバムを開くために使います。
        NSAppleMusicUsageDescription: Goで再生中の曲を表示し、再生・一時停止・スキップ・シャッフルを操作するために使います。
        NSPhotoLibraryAddUsageDescription: Slidesで書き出したスライドの画像や、toocで届いた写真、Galleryの写真を写真に保存するために使います。
        # Notes are kept in Documents and shown in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ffuime.withdays
            CFBundleURLSchemes:
              - withdays
    dependencies:
      - target: WithDaysWidget
      - target: SubsReport
      - package: SlidesFeature
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ffuime.withdays
        PRODUCT_NAME: WithDays
        CODE_SIGN_ENTITLEMENTS: Entitlements/WithDays.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  # tooc as an app of its own (tooc.ipa): the same code as inside WithDays, without the calendar around it.
  Tooc:
    type: application
    platform: iOS
    sources:
      - path: Tooc
        excludes:
          - AppIcon.svg
      - path: WithDays/Features/Tooc
      - path: WithDays/Support/AppInfo.swift
      - path: WithDays/Components/ZoomableImage.swift
      # The same Firebase settings as WithDays (written by the build).
      - path: WithDays/GoogleService-Info.plist
        buildPhase: resources
        optional: true
    info:
      path: Tooc/Info.plist
      properties:
        CFBundleDisplayName: tooc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: トークで位置情報を送るために使います。
        NSCameraUsageDescription: 友だちのQRコードを読み取り、写真を撮って送るために使います。
        NSPhotoLibraryAddUsageDescription: 届いた写真やMyQRを写真に保存するために使います。
        CFBundleURLTypes:
          - CFBundleURLName: com.ffuime.tooc
            CFBundleURLSchemes:
              - tooc
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ffuime.tooc
        PRODUCT_NAME: tooc
        # tooc's own version (its changelog is ToocInfo).
        MARKETING_VERSION: "1.2.2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  WithDaysWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WithDaysWidget
      # Date math, colors and deep links are shared with the app.
      - path: WithDays/Support/Formatting.swift
      - path: WithDays/Support/Theme.swift
      - path: WithDays/Support/AppGroup.swift
      - path: WithDays/Support/TodoMeta.swift
    info:
      path: WithDaysWidget/Info.plist
      properties:
        CFBundleDisplayName: WithDays
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: ウィジェットに今週の予定を表示するために使います。
        NSRemindersFullAccessUsageDescription: ウィジェットにToDoを表示し、完了にするために使います。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ffuime.withdays.widget
        PRODUCT_NAME: WithDaysWidget
        CODE_SIGN_ENTITLEMENTS: Entitlements/WithDaysWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  # Subscribes' Screen Time report: this month's time in a subscription's app.
  SubsReport:
    type: app-extension
    platform: iOS
    sources:
      - path: SubsReport
      - path: WithDays/Support/SubsShared.swift
      - path: WithDays/Support/Formatting.swift
      - path: WithDays/Support/Theme.swift
      - path: WithDays/Support/AppGroup.swift
      - path: WithDays/Support/TodoMeta.swift
    info:
      path: SubsReport/Info.plist
      properties:
        CFBundleDisplayName: WithDays
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ffuime.withdays.subsreport
        PRODUCT_NAME: SubsReport
        CODE_SIGN_ENTITLEMENTS: Entitlements/SubsReport.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
