name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 macOS runners are often stuck queued for capacity; the Intel image has the same Xcode.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Firebase settings for tooc
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > WithDays/GoogleService-Info.plist
            plutil -lint WithDays/GoogleService-Info.plist
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST is not set, so tooc is built without its server"
          fi

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: URL scheme for tooc's phone sign-in
        run: |
          # Firebase's reCAPTCHA check returns to app-<GOOGLE_APP_ID with : as ->.
          [ -f WithDays/GoogleService-Info.plist ] || exit 0
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" WithDays/GoogleService-Info.plist)
          SCHEME="app-$(echo "$APP_ID" | tr ':' '-')"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLName string firebase-phone" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $SCHEME" WithDays/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" WithDays/Info.plist

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep 'MARKETING_VERSION' project.yml | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WithDays.xcodeproj \
            -scheme WithDays \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          # The .app folder appears before Swift compiles, so check the build result itself.
          grep -q "BUILD SUCCEEDED" build.log
          test -d build/Build/Products/Release-iphoneos/WithDays.app/PlugIns/WithDaysWidget.appex
          test -d build/Build/Products/Release-iphoneos/WithDays.app/PlugIns/SubsReport.appex

      - name: Show compile errors
        if: failure()
        run: |
          # Surface each compiler error as an annotation so it shows on the run summary.
          grep -E "^/.*: error: " build.log | sort -u | head -n 50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||")
            row=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | sed -E 's/^[^ ]+ error: //')
            echo "::error file=$file,line=$row::$msg"
          done
          grep -E "error:" -A3 build.log | head -n 200 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/WithDays.app
          # The build is unsigned, so embed the entitlements with an ad-hoc signature
          # (extensions first, then the app); SideStore reads them when it re-signs.
          # Screen Time is left out: its entitlement may stop a free Apple ID from installing.
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          rm -rf Payload/WithDays.app/PlugIns/SubsReport.appex
          codesign -f -s - --entitlements Entitlements/WithDaysWidget.entitlements Payload/WithDays.app/PlugIns/WithDaysWidget.appex
          codesign -f -s - --entitlements Entitlements/WithDays.entitlements Payload/WithDays.app
          codesign -d --entitlements - Payload/WithDays.app
          zip -qry WithDays.ipa Payload
          ls -l WithDays.ipa
          # What takes the room, biggest first.
          du -sh Payload/WithDays.app
          find Payload/WithDays.app -type f -size +200k -exec ls -l {} + | sort -k5 -n -r | awk '{print $5, $9}' | head -n 15

      - uses: actions/upload-artifact@v4
        with:
          name: WithDays-ipa
          path: WithDays.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WithDays.ipa
          generate_release_notes: true

      - name: Update SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIZE=$(stat -f%z WithDays.ipa)
          git fetch origin main
          git checkout main
          python3 scripts/update_source.py \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}" \
            --size "$SIZE" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WithDays.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update SideStore source to ${{ github.ref_name }}" || exit 0
          git push origin main

      # SlidesFeature's unit tests, on an iOS simulator. After the IPA is uploaded, so a failing test
      # still leaves the build to install.
      - name: Test SlidesFeature
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS-26" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::warning::No iOS 26 simulator on this runner; tests skipped"
            exit 0
          fi
          cd SlidesFeature
          SCHEME=$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin).get("workspace", {}).get("schemes", [])
          print(next((s for s in schemes if s.endswith("-Package")), "SlidesFeature"))
          ')
          echo "Testing $SCHEME on $UDID"
          xcodebuild test -scheme "$SCHEME" -destination "id=$UDID" -derivedDataPath ../build-tests 2>&1 \
            | tee ../test.log | grep -E "error:|Test Case .*failed|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" ../test.log

      - name: Show test failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          grep -E "error:|failed" test.log | sort -u | head -n 60 | while IFS= read -r line; do echo "::error::$line"; done
